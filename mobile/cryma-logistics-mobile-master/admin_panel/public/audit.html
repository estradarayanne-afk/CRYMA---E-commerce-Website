<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Log - CRYMA Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <div class="container">
    <h1>Audit Log</h1>

    <div class="audit-controls">
      <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
      <span class="audit-info">Showing latest actions</span>
    </div>

    <div id="loading" class="loading-spinner" style="display: none;">
      <div class="spinner"></div>
      <p>Loading audit logs...</p>
    </div>

    <div id="error" class="error-message" style="display: none;"></div>

    <div class="audit-table-wrapper">
      <table id="auditTable" class="audit-table">
        <thead>
          <tr>
            <th>Timestamp</th>
            <th>Admin</th>
            <th>Action</th>
            <th>Target</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="auditBody">
          <tr class="empty-row">
            <td colspan="5">No audit logs found</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupNavbar();
      loadAuditLogs();

      document.getElementById('refreshBtn').addEventListener('click', loadAuditLogs);
    });

    async function loadAuditLogs() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const tbody = document.getElementById('auditBody');

      loading.style.display = 'flex';
      error.style.display = 'none';
      tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Loading...</td></tr>';

      try {
        const result = await apiClient.getAuditLogs(100, 0);

        if (result && result.success) {
          const logs = result.data.logs || [];
          displayAuditLogs(logs);
        } else {
          throw new Error(result?.error || 'Failed to load audit logs');
        }
      } catch (err) {
        error.textContent = 'Failed to load audit logs: ' + err.message;
        error.style.display = 'block';
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">Error loading data</td></tr>';
      } finally {
        loading.style.display = 'none';
      }
    }

    function displayAuditLogs(logs) {
      const tbody = document.getElementById('auditBody');

      if (logs.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No audit logs</td></tr>';
        return;
      }

      tbody.innerHTML = logs
        .map(
          (log) => `
        <tr>
          <td>${formatDate(log.createdAt)}</td>
          <td>${escapeHtml(log.adminName || 'Unknown')}</td>
          <td><span class="audit-action">${escapeHtml(log.action)}</span></td>
          <td>${log.targetId ? escapeHtml(log.targetType + ' #' + log.targetId) : '-'}</td>
          <td>${escapeHtml(log.details || '-')}</td>
        </tr>
      `
        )
        .join('');
    }
  </script>
</body>
</html>
