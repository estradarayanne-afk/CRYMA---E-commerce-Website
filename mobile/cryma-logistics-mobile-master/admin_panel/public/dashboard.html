<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - CRYMA Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav id="navbar" class="navbar"></nav>

  <div class="container">
    <h1>Dashboard</h1>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="pendingCount">-</div>
        <div class="stat-label">Pending Riders</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="activeCount">-</div>
        <div class="stat-label">Active Riders</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalCount">-</div>
        <div class="stat-label">Total Riders</div>
      </div>
    </div>

    <div class="action-buttons">
      <a href="/riders.html" class="btn btn-primary">View Pending Riders</a>
      <button id="refreshBtn" class="btn btn-secondary">Refresh Stats</button>
    </div>

    <div id="loading" class="loading-spinner" style="display: none;">
      <div class="spinner"></div>
      <p>Loading...</p>
    </div>

    <div id="error" class="error-message" style="display: none;"></div>

    <p class="last-updated">Last updated: <span id="lastUpdated">-</span></p>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setupNavbar();
      loadStats();

      // Auto-refresh every 30 seconds
      setInterval(loadStats, 30000);

      document.getElementById('refreshBtn').addEventListener('click', loadStats);
    });

    async function loadStats() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');

      loading.style.display = 'flex';
      error.style.display = 'none';

      try {
        const result = await apiClient.getStats();

        if (result && result.success) {
          const stats = result.data.stats;
          document.getElementById('pendingCount').textContent = stats.pendingRiders;
          document.getElementById('activeCount').textContent = stats.activeRiders;
          document.getElementById('totalCount').textContent = stats.totalRiders;
          document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();
        } else {
          throw new Error(result?.error || 'Failed to load stats');
        }
      } catch (err) {
        error.textContent = 'Failed to load statistics: ' + err.message;
        error.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
